# Alembic configuration file
# Reference: https://alembic.sqlalchemy.org/en/latest/tutorial.html

[alembic]
# Path to the migration scripts directory, relative to this file
script_location = alembic

# Template for new migration file names
# %(rev)s = revision id, %(slug)s = short description
file_template = %%(rev)s_%%(slug)s

# Prepend sys.path so `app` package is importable during migrations
prepend_sys_path = .

# Timezone for migration timestamps
timezone = UTC

# Do NOT hard-code the DB URL here.
# It is injected at runtime from the environment in env.py.
sqlalchemy.url =

[post_write_hooks]
# Optional: run black on generated migration files
# hooks = black
# black.type = console_scripts
# black.entrypoint = black
# black.options = -l 88

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
