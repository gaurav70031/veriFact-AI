# Production nginx configuration for VeritasAI frontend
#
# This config:
#   1. Serves the React SPA with HTML5 history-mode routing
#   2. Proxies /api/* to the backend service (so CORS is not needed)
#   3. Sets security headers
#   4. Enables gzip compression
#   5. Caches static assets aggressively
#   6. Redirects HTTP → HTTPS (when SSL termination is at nginx level)

upstream backend {
    # "backend" resolves to the Docker Compose service name
    server backend:8000;
    keepalive 32;
}

server {
    listen 80;
    server_name _;

    root  /usr/share/nginx/html;
    index index.html;

    # ── Security headers ──────────────────────────────────────────────────────
    add_header X-Frame-Options           "SAMEORIGIN"             always;
    add_header X-Content-Type-Options    "nosniff"                always;
    add_header X-XSS-Protection          "1; mode=block"          always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy        "camera=(), microphone=(), geolocation=()" always;
    # Enable a strict CSP in production — adjust allowed domains as needed
    # add_header Content-Security-Policy "default-src 'self'; ..." always;

    # ── Gzip ─────────────────────────────────────────────────────────────────
    gzip            on;
    gzip_vary       on;
    gzip_proxied    any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        application/json
        application/javascript
        application/xml+rss
        application/atom+xml
        image/svg+xml;

    # ── API proxy — avoids cross-origin cookie issues ─────────────────────────
    # All requests to /api/* are forwarded to the backend container.
    # The frontend is built with VITE_API_BASE_URL=/api/v1 so it uses this path.
    location /api/ {
        proxy_pass         http://backend;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";

        # Timeouts — long for ML inference (can take 30s+)
        proxy_connect_timeout 10s;
        proxy_send_timeout    120s;
        proxy_read_timeout    120s;

        # Pass cookies through (required for httpOnly JWT auth)
        proxy_pass_header   Set-Cookie;
    }

    # ── Docs proxy (OpenAPI / Swagger) ────────────────────────────────────────
    location ~ ^/(docs|redoc|openapi\.json)$ {
        proxy_pass         http://backend;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # ── Static assets — aggressive caching ────────────────────────────────────
    location /assets/ {
        expires     1y;
        add_header  Cache-Control "public, immutable";
        access_log  off;
    }

    # ── favicon and manifest ──────────────────────────────────────────────────
    location ~* \.(ico|png|svg|webmanifest)$ {
        expires     30d;
        add_header  Cache-Control "public";
        access_log  off;
    }

    # ── React Router — SPA fallback ───────────────────────────────────────────
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── Health check endpoint for load balancers ──────────────────────────────
    location /nginx-health {
        access_log  off;
        return 200  "healthy\n";
        add_header  Content-Type text/plain;
    }

    # ── Block common attack paths ─────────────────────────────────────────────
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}
